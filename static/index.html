<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Peaberry Quant Data</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #091326;
        --panel: #10213a;
        --panel-soft: #172c4b;
        --line: #2b4468;
        --line-soft: rgba(143, 176, 217, 0.2);
        --text: #eef6ff;
        --muted: #9bb8de;
        --accent: #78c6ff;
        --good: #45d483;
        --warn: #f9c25a;
        --bad: #ff6b85;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: radial-gradient(circle at top, #122847 0%, var(--bg) 34%);
        color: var(--text);
        margin: 0;
        padding: 2rem;
      }

      main {
        margin: 0 auto;
        max-width: 1180px;
      }

      h1 {
        font-size: 1.65rem;
        margin: 0 0 0.25rem;
      }

      p {
        color: var(--muted);
        margin: 0;
      }

      form,
      .panel {
        background: linear-gradient(180deg, var(--panel), #0f1f36);
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.18);
        margin-top: 1rem;
        padding: 1.1rem;
      }

      input,
      button {
        font: inherit;
      }

      input {
        background: #0a1528;
        border: 1px solid var(--line);
        border-radius: 10px;
        color: var(--text);
        padding: 0.7rem 0.75rem;
        width: 100%;
      }

      button {
        background: linear-gradient(180deg, #2d679d, #24527d);
        border: 0;
        border-radius: 999px;
        color: white;
        cursor: pointer;
        font-weight: 700;
        padding: 0.75rem 1rem;
      }

      button.secondary {
        background: #314866;
      }

      .form-grid {
        display: grid;
        gap: 0.65rem;
        grid-template-columns: 1.1fr 0.8fr 1fr 1.1fr 1.4fr auto;
      }

      .dashboard {
        display: grid;
        gap: 1rem;
      }

      .kpi-grid,
      .valuation-grid,
      .unit-grid,
      .meta-grid {
        display: grid;
        gap: 0.7rem;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      }

      .content-grid {
        display: grid;
        gap: 0.95rem;
        grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr);
      }

      .surface,
      .card,
      .unit-card {
        background: linear-gradient(180deg, var(--panel-soft), #132844);
        border: 1px solid var(--line-soft);
        border-radius: 16px;
        padding: 0.85rem;
      }

      .surface {
        padding: 1rem;
      }

      .section-head {
        align-items: center;
        display: flex;
        justify-content: space-between;
        margin-bottom: 0.7rem;
      }

      .section-head h2,
      .section-head h3 {
        font-size: 0.98rem;
        letter-spacing: 0.01em;
        margin: 0;
      }

      .section-head p {
        color: var(--muted);
        font-size: 0.8rem;
      }

      .label {
        color: var(--muted);
        display: block;
        font-size: 0.82rem;
        margin-bottom: 0.25rem;
      }

      .value {
        font-size: 1.2rem;
        font-weight: 800;
      }

      .kpi-grid .card {
        background: linear-gradient(180deg, #1a3355, #132944);
        min-height: 82px;
      }

      .kpi-grid .label {
        font-size: 0.78rem;
      }

      .kpi-grid .value {
        font-size: 1.25rem;
      }

      .unit {
        color: var(--muted);
        font-size: 0.8rem;
        margin-left: 0.25rem;
      }

      .status-pill {
        border-radius: 999px;
        border: 1px solid var(--line);
        color: var(--muted);
        display: inline-flex;
        font-size: 0.74rem;
        font-weight: 700;
        gap: 0.35rem;
        padding: 0.22rem 0.56rem;
      }

      .status-pill.good {
        border-color: rgba(69, 212, 131, 0.45);
        color: var(--good);
      }

      .status-pill.warn {
        border-color: rgba(249, 194, 90, 0.45);
        color: var(--warn);
      }

      .status-pill.bad {
        border-color: rgba(255, 107, 133, 0.45);
        color: var(--bad);
      }

      .diagnostics {
        background: linear-gradient(180deg, #162941, #102239);
        border: 1px solid rgba(255, 107, 133, 0.35);
        border-radius: 14px;
        padding: 0.75rem;
      }

      .diagnostics ul {
        margin: 0.4rem 0 0;
        padding-left: 1.15rem;
      }

      .diagnostics li {
        color: #ffbfd0;
        font-size: 0.85rem;
        line-height: 1.5;
      }

      .table-wrap {
        border: 1px solid var(--line-soft);
        border-radius: 14px;
        overflow: auto;
      }

      table {
        border-collapse: collapse;
        min-width: 1280px;
        width: 100%;
      }

      th,
      td {
        border-bottom: 1px solid rgba(143, 176, 217, 0.16);
        padding: 0.75rem;
        text-align: right;
        vertical-align: middle;
      }

      th {
        background: #0a1b31;
        color: #cfe4ff;
        font-size: 0.86rem;
        position: sticky;
        top: 0;
        z-index: 1;
      }

      th:first-child,
      td:first-child,
      th:last-child,
      td:last-child {
        text-align: left;
      }

      th span {
        color: var(--muted);
        display: block;
        font-size: 0.76rem;
        font-weight: 600;
        margin-top: 0.2rem;
      }

      .missing {
        color: var(--muted);
      }

      .estimate-row td:first-child {
        color: var(--accent);
        font-weight: 700;
      }

      .fill-cell {
        align-items: center;
        display: grid;
        gap: 0.35rem;
        grid-template-columns: minmax(96px, 1fr) auto;
      }

      .fill-cell input {
        min-width: 90px;
        padding: 0.45rem;
        text-align: right;
      }

      .source {
        color: var(--muted);
        font-size: 0.84rem;
      }

      .source-chip {
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--muted);
        display: inline-block;
        font-size: 0.72rem;
        margin-left: 0.35rem;
        padding: 0.16rem 0.44rem;
      }

      .notes {
        color: var(--muted);
        line-height: 1.55;
        margin: 0;
        padding-left: 1.25rem;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.45rem;
      }

      pre {
        background: #0a1628;
        border: 1px solid var(--line-soft);
        border-radius: 12px;
        color: #e5e7eb;
        overflow: auto;
        padding: 0.8rem;
        white-space: pre-wrap;
      }

      details summary {
        color: var(--muted);
        cursor: pointer;
      }

      .error {
        color: var(--bad);
      }

      .stack {
        display: grid;
        gap: 0.85rem;
      }

      @media (max-width: 780px) {
        body {
          padding: 1rem;
        }

        .form-grid {
          grid-template-columns: 1fr;
        }

        .content-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Peaberry Quant Data</h1>
      <p>
        국내/해외 종목의 재무 금액, 주당 지표, 배수, % 지표를 별도 단위로 표시합니다.
        빈 칸은 표시 단위 기준으로 직접 입력해 보완할 수 있습니다.
      </p>
      <form id="snapshot-form">
        <div class="form-grid">
          <input id="ticker" placeholder="Ticker, e.g. 000660 or AAPL" required />
          <input id="market" placeholder="Market, e.g. KOSPI or US" />
          <input id="corp-code" placeholder="OpenDART corp_code" />
          <input id="years" placeholder="Years, e.g. 2024,2023,2022" />
          <input id="dart-api-key" placeholder="OpenDART API key (optional)" />
          <button type="submit">조회</button>
        </div>
      </form>
      <section id="output" class="panel">종목을 입력하면 단위가 주석 처리된 표가 표시됩니다.</section>
    </main>
    <script>
      const form = document.getElementById("snapshot-form");
      const output = document.getElementById("output");
      let lastSnapshot = null;

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const ticker = document.getElementById("ticker").value.trim();
        const market = document.getElementById("market").value.trim();
        const corpCode = document.getElementById("corp-code").value.trim();
        const years = document.getElementById("years").value.trim();
        const dartApiKey = document.getElementById("dart-api-key").value.trim();
        const params = new URLSearchParams();
        if (market) params.set("market", market);
        if (corpCode) params.set("corp_code", corpCode);
        if (years) params.set("years", years);
        if (dartApiKey) params.set("dart_api_key", dartApiKey);

        output.textContent = "Loading...";
        try {
          const response = await fetch(`/api/snapshot/${encodeURIComponent(ticker)}?${params.toString()}`);
          const body = await response.json();
          if (!response.ok) {
            throw new Error(body.detail || "Snapshot request failed");
          }
          lastSnapshot = body;
          renderSnapshot(body);
        } catch (error) {
          output.innerHTML = `<strong class="error">오류:</strong> ${escapeHtml(error.message)}`;
        }
      });

      output.addEventListener("input", (event) => {
        if (!event.target.matches(".manual-fill")) return;
        renderFillExport();
      });

      output.addEventListener("click", (event) => {
        if (event.target.id === "save-fills") {
          localStorage.setItem(storageKey(lastSnapshot), JSON.stringify(readManualFills()));
          renderFillExport("브라우저에 저장했습니다.");
        }
        if (event.target.id === "clear-fills") {
          localStorage.removeItem(storageKey(lastSnapshot));
          renderSnapshot(lastSnapshot);
        }
      });

      function renderSnapshot(snapshot) {
        const display = snapshot.display;
        const fills = loadManualFills(snapshot);
        const completeness = completenessScore(display);
        const diagnostics = snapshot.diagnostics || [];
        output.innerHTML = `
          <div class="dashboard">
          <div class="kpi-grid">
            ${summaryCard("종목", `${snapshot.security.name || ""} ${snapshot.security.ticker}`.trim())}
            ${summaryCard("시장", display.market.market || display.market.kind)}
            ${summaryCard("현재가", formatWithUnit(snapshot.quote?.price, snapshot.quote?.currency))}
            ${summaryCard("자료원", sourceLabel(snapshot))}
            ${summaryCard("데이터 완성도", completenessPill(completeness))}
          </div>
          ${diagnosticsBanner(diagnostics)}
          <div class="content-grid">
            <section class="surface stack">
              <div>
                <div class="section-head">
                  <h2>단위/계산 체계</h2>
                  <span class="status-pill">raw → display</span>
                </div>
                <div class="unit-grid">
                  ${unitCard("매출/영업이익/순이익", display.units.amount.display, `${display.units.amount.raw} 원자료 ÷ ${display.units.amount.divisor.toLocaleString()}`)}
                  ${unitCard("EPS/BPS", display.units.per_share.display, "주당 지표")}
                  ${unitCard("PER/PBR", display.units.multiple.display, "배수")}
                  ${unitCard("ROE", display.units.percent.display, "순이익 ÷ 자본총계")}
                </div>
              </div>
              <div>
                <div class="section-head">
                  <h2>연간 재무 정보</h2>
                  <p>추정치 기간은 (E)로 표시</p>
                </div>
                ${annualTable(display, fills)}
              </div>
            </section>
            <aside class="surface stack">
              <div>
                <div class="section-head">
                  <h3>밸류에이션 / 추정</h3>
                </div>
                <div class="valuation-grid">${valuationCards(display.valuation_items, fills)}</div>
              </div>
              <div>
                <div class="section-head">
                  <h3>수동 보정</h3>
                </div>
                <div class="actions">
                  <button type="button" id="save-fills">빈 칸 저장</button>
                  <button type="button" class="secondary" id="clear-fills">저장값 지우기</button>
                </div>
                <pre id="fill-export"></pre>
              </div>
            </aside>
          </div>
          <details>
            <summary>Raw API response</summary>
            <pre>${escapeHtml(JSON.stringify(snapshot, null, 2))}</pre>
          </details>
          <div class="surface">
            <div class="section-head">
              <h3>해석 참고</h3>
            </div>
            <ul class="notes">${display.notes.map((note) => `<li>${escapeHtml(note)}</li>`).join("")}</ul>
          </div>
          </div>
        `;
        for (const input of output.querySelectorAll(".manual-fill")) {
          input.value = fills[input.dataset.fillKey] ?? "";
        }
        renderFillExport();
      }

      function annualTable(display, fills) {
        const amountUnit = escapeHtml(display.units.amount.display);
        const perShareUnit = escapeHtml(display.units.per_share.display);
        const multipleUnit = escapeHtml(display.units.multiple.display);
        const percentUnit = escapeHtml(display.units.percent.display);
        const rows = display.annual_rows.map((row) => `
          <tr class="${row.is_estimate ? "estimate-row" : ""}">
            <td>${escapeHtml(row.period || `${row.year}.12`)}</td>
            ${valueCell(row.values.revenue, fillKey(row.values.revenue.fill), fills)}
            ${valueCell(row.values.operating_income, fillKey(row.values.operating_income.fill), fills)}
            ${valueCell(row.values.net_income, fillKey(row.values.net_income.fill), fills)}
            ${valueCell(row.values.roe, fillKey(row.values.roe.fill), fills)}
            ${valueCell(row.values.eps, fillKey(row.values.eps.fill), fills)}
            ${valueCell(row.values.per, fillKey(row.values.per.fill), fills)}
            ${valueCell(row.values.bps, fillKey(row.values.bps.fill), fills)}
            ${valueCell(row.values.pbr, fillKey(row.values.pbr.fill), fills)}
            <td class="source">${escapeHtml(row.source || "-")}${sourceChips(row)}</td>
          </tr>
        `).join("");
        return `
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>기간</th>
                  <th>매출<span>${amountUnit}</span></th>
                  <th>영업이익<span>${amountUnit}</span></th>
                  <th>순이익<span>${amountUnit}</span></th>
                  <th>ROE<span>${percentUnit}</span></th>
                  <th>EPS<span>${perShareUnit}</span></th>
                  <th>PER<span>${multipleUnit}</span></th>
                  <th>BPS<span>${perShareUnit}</span></th>
                  <th>PBR<span>${multipleUnit}</span></th>
                  <th>자료원</th>
                </tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        `;
      }

      function valuationCards(items, fills) {
        return items.map((item) => {
          const key = fillKey(item.value.fill);
          return `
            <div class="card">
              <span class="label">${escapeHtml(item.label)} <span class="unit">${escapeHtml(item.value.unit)}</span></span>
              ${valueCell(item.value, key, fills, true)}
              <div class="source">${escapeHtml(item.source || "-")}${item.is_fallback ? '<span class="source-chip">fallback</span>' : ""}</div>
            </div>
          `;
        }).join("");
      }

      function valueCell(cell, key, fills, block = false) {
        if (!cell.is_missing) {
          return block
            ? `<div class="value">${escapeHtml(cell.formatted)}<span class="unit">${escapeHtml(cell.unit)}</span></div>`
            : `<td>${escapeHtml(cell.formatted)}<span class="unit">${escapeHtml(cell.unit)}</span></td>`;
        }
        const manual = key && fills[key] ? fills[key] : "";
        const control = `
          <div class="fill-cell">
            <input class="manual-fill" data-fill-key="${escapeHtml(key)}" placeholder="${escapeHtml(cell.unit)} 입력" value="${escapeHtml(manual)}" />
            <span class="unit">${escapeHtml(cell.unit)}</span>
          </div>
        `;
        return block ? control : `<td class="missing">${control}</td>`;
      }

      function renderFillExport(message = "") {
        const element = document.getElementById("fill-export");
        if (!element || !lastSnapshot) return;
        const fills = readManualFills();
        const payload = {
          ticker: lastSnapshot.security.ticker,
          market: lastSnapshot.security.market,
          input_scale: "display",
          manual_fills: fills,
        };
        const prefix = message ? `${message}\n\n` : "";
        element.textContent = `${prefix}입력한 빈 칸(JSON):\n${JSON.stringify(payload, null, 2)}`;
      }

      function readManualFills() {
        const fills = {};
        for (const input of output.querySelectorAll(".manual-fill")) {
          const value = input.value.trim();
          if (value) fills[input.dataset.fillKey] = value;
        }
        return fills;
      }

      function loadManualFills(snapshot) {
        try {
          return JSON.parse(localStorage.getItem(storageKey(snapshot)) || "{}");
        } catch {
          return {};
        }
      }

      function storageKey(snapshot) {
        if (!snapshot) return "peaberry:fills";
        const years = snapshot.display.annual_rows.map((row) => row.year).join(",");
        return `peaberry:fills:${snapshot.security.ticker}:${snapshot.security.market || ""}:${years}`;
      }

      function fillKey(fill) {
        if (!fill) return "";
        return [fill.scope, fill.year || "current", fill.field].join(".");
      }

      function summaryCard(label, value) {
        let meta = "";
        let text = value;
        if (typeof value === "object" && value !== null) {
          meta = value.meta || "";
          text = value.text || "-";
        }
        return `
          <div class="card">
            <span class="label">${escapeHtml(label)}</span>
            <span class="value">${escapeHtml(text || "-")}</span>
            ${meta ? `<div class="source">${meta}</div>` : ""}
          </div>
        `;
      }

      function unitCard(label, unit, note) {
        return `<div class="unit-card"><span class="label">${escapeHtml(label)}</span><span class="value">${escapeHtml(unit)}</span><p>${escapeHtml(note)}</p></div>`;
      }

      function sourceLabel(snapshot) {
        const sources = new Set();
        if (snapshot.quote?.source) sources.add(snapshot.quote.source);
        if (snapshot.valuation?.source) sources.add(snapshot.valuation.source);
        for (const row of snapshot.annual_financials || []) sources.add(row.source);
        return [...sources].join(" + ") || "-";
      }

      function formatWithUnit(value, unit) {
        if (value === null || value === undefined) return "-";
        return `${Number(value).toLocaleString()} ${unit || ""}`.trim();
      }

      function sourceChips(row) {
        const chips = [];
        if (row.is_estimate) chips.push('<span class="source-chip">estimate</span>');
        if (row.is_fallback) chips.push('<span class="source-chip">fallback</span>');
        return chips.join("");
      }

      function completenessScore(display) {
        const annualCount = display.annual_rows.length;
        const annualMetrics = 8;
        const valuationCount = display.valuation_items.length;
        const total = annualCount * annualMetrics + valuationCount;
        const missing = (display.missing_fields || []).length;
        if (total <= 0) return 0;
        return Math.max(0, Math.min(100, Math.round(((total - missing) / total) * 100)));
      }

      function completenessPill(score) {
        if (score >= 85) return { text: `${score}%`, meta: '<span class="status-pill good">stable</span>' };
        if (score >= 60) return { text: `${score}%`, meta: '<span class="status-pill warn">partial</span>' };
        return { text: `${score}%`, meta: '<span class="status-pill bad">sparse</span>' };
      }

      function diagnosticsBanner(diagnostics) {
        if (!diagnostics || diagnostics.length === 0) return "";
        return `
          <div class="diagnostics">
            <div class="section-head">
              <h3>수집 진단</h3>
              <span class="status-pill bad">check required</span>
            </div>
            <ul>${diagnostics.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul>
          </div>
        `;
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }
    </script>
  </body>
</html>
